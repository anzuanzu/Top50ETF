name: Sync Cathay ETF universe

on:
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-cathay-etfs.mjs
      - name: Commit refreshed universe when changed
        run: |
          if git diff --quiet -- data/cathay-etfs.json; then
            echo "Cathay ETF universe is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cathay-etfs.json
          git commit -m "Sync Cathay ETF universe"
          git push
